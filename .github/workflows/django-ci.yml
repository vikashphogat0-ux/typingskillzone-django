name: Django CI

on:
  push:
    branches:
      - integration/release-review-2026-11
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.15 / PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: typingskillzone_test
          POSTGRES_USER: django
          POSTGRES_PASSWORD: django-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django -d typingskillzone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: typingskillzone_test
      DJANGO_DB_USER: django
      DJANGO_DB_PASSWORD: django-ci-password
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check for model/migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run full test suite on PostgreSQL
        working-directory: backend
        run: python manage.py test --verbosity 2

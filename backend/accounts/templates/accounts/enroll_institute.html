<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enroll in Institute | TypingSkillZone</title>
<style>
:root{color-scheme:dark;--bg:#091321;--panel:#14243a;--line:#294363;--text:#eef5ff;--muted:#9db1cb;--cyan:#45d5e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#1a3e68,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}.panel{width:min(100%,520px);padding:32px;background:linear-gradient(145deg,#192e49,var(--panel));border:1px solid var(--line);border-radius:20px}.brand{font-size:20px;font-weight:800}.brand span{color:var(--cyan)}h1{font-size:27px;margin:25px 0 4px}.muted{color:var(--muted)}label{display:block;margin:16px 0 7px;font-weight:650}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#0b192b;color:var(--text);font:inherit}button,.button{display:inline-block;margin-top:20px;padding:12px 16px;border:0;border-radius:10px;background:linear-gradient(90deg,#3979ed,#36a9d8);color:white;font-weight:800;text-decoration:none;cursor:pointer}.errorlist,.error{color:#ff9ca7}a{color:#9bc4ff}.field{margin-bottom:10px}
</style></head><body><main class="panel"><div class="brand">Typing<span>Skill</span>Zone</div><h1>Join an institute</h1><p class="muted">Enter the registration code provided by your institute. Only approved institutes can accept enrollment.</p><form method="post">{% csrf_token %}<div class="field"><label for="{{ form.registration_code.id_for_label }}">Institute registration code</label>{{ form.registration_code }}{% if form.registration_code.errors %}<div class="error">{{ form.registration_code.errors }}</div>{% endif %}</div><button type="submit">Submit enrollment</button></form><p><a href="{% url 'institutes:student_dashboard' %}">Back to dashboard</a></p></main></body></html>

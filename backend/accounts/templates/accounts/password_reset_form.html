{% extends "passages/site_base.html" %}
{% block title %}Reset your password · TypingSkillZone{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="auth-panel">
    <span class="eyebrow">TypingSkillZone</span>
    <h1>Reset your password</h1>
    <p class="intro">Enter your email address and we will send you a link to choose a new password.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Send reset link</button>
    </form>
  </section>
</div>
{% endblock %}

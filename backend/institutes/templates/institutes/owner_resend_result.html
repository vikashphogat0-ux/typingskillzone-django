{% extends "passages/site_base.html" %}
{% block title %}Verification request · TypingSkillZone{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="auth-panel">
    <span class="eyebrow">TypingSkillZone</span>
    <h1>Verification request</h1>
    <p class="intro">{{ message }}</p>
    <form method="post" style="margin-top:22px">{% csrf_token %}
      <div class="form-field">
        <label for="email">Owner email</label>
        <input id="email" type="email" name="email" required>
      </div>
      <button class="btn btn-primary" type="submit">Resend verification link</button>
    </form>
    <div class="auth-links"><a href="{% url 'institutes:owner_login' %}">Return to owner login</a></div>
  </section>
</div>
{% endblock %}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner email verification | TypingSkillZone</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#091321;color:#eef5ff;font:15px/1.5 Segoe UI,Arial}.panel{width:min(100%,520px);padding:32px;background:#14243a;border:1px solid #294363;border-radius:18px}button{margin-top:20px;padding:12px 18px;border:0;border-radius:9px;background:#3979ed;color:white;font-weight:700;cursor:pointer}.muted{color:#9db1cb}</style></head>
<body><main class="panel"><h1>{% if success %}Email verified{% elif confirmation %}Confirm your email{% else %}Verification unsuccessful{% endif %}</h1><p class="muted">{{ message }}</p>
{% if confirmation %}<form method="post">{% csrf_token %}<button type="submit">Verify email and activate owner account</button></form>
{% elif success %}<a href="{% url 'institutes:owner_login' %}">Go to owner login</a>
{% else %}<a href="{% url 'institutes:resend_owner_verification' %}">Request a new verification link</a>{% endif %}
</main></body></html>
